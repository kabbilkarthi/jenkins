---
install_mysql: false
install_docker: false

set_hostname: true
set_hosts_file: true

host_name: "{{ vm_name | default('localhost') }}"
host_domain: "lab.example.com"
host_fqdn: "{{ host_name }}.{{ host_domain }}"
host_ip: "{{ ansible_ens160.ipv4.address | default('127.0.0.1') }}"

mysql_root_password: "Kabbil123!"
mysql_bind_address: "0.0.0.0"
mysql_port: 3306

ssh_public_keys:
  - "ssh-rsa  root@vm1.lab.example.com"

# keep only local/internal repos for mysql
mysql_enabled_repos:
  - BaseOS
  - AppStream

docker_users:
  - kabbil
